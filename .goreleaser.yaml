version: 2

project_name: mollie-cli

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: mollie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: mollie
    repository:
      owner: fjbender
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/fjbender/mollie-cli
    license: GPL-3.0-only
    description: Unofficial command-line interface for the Mollie payment platform
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    caveats: |
      The optional `webhook-tunnel` command needs cloudflared:
        brew install cloudflared
    test: |
      system "#{bin}/mollie", "--version"

release:
  github:
    owner: fjbender
    name: mollie-cli
